<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatCloud</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f5f7]">
<div class="flex h-screen">
  <div class="w-64 bg-white p-6 hidden md:block border-r">
    <h1 class="text-2xl font-bold">☁️ BharatCloud</h1>
    <div class="mt-8 bg-black text-white p-3 rounded-xl">📁 My Files</div>
  </div>
  <div class="flex-1 p-6">
    <div class="flex justify-between">
      <h2 class="text-3xl font-bold">My Files</h2>
      <form action="/upload" method="post" enctype="multipart/form-data">
        <label class="bg-black text-white px-6 py-3 rounded-full cursor-pointer">
          + Upload
          <input type="file" name="file" class="hidden" onchange="this.form.submit()">
        </label>
      </form>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mt-8">
      {% for file in files %}
      <div class="bg-white p-5 rounded-[24px]">
        <div class="text-4xl">📄</div>
        <p class="font-bold truncate mt-3">{{ file }}</p>
        <a href="/download/{{ file }}" class="text-sm bg-gray-100 px-3 py-1 rounded-full mt-2 inline-block">Download</a>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
</body>
</html>
