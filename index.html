<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BharatCloud</title>
</head>
<body style="text-align:center;font-family:sans-serif;padding-top:30px">
<h2>BharatCloud Dashboard ✅ Login Success!</h2>
<input type="file" id="fileInput">
<button onclick="upload()">Upload</button>

<h2>My Files</h2>
<div id="files">Loading...</div>
<br>
<button onclick="logout()">Logout</button>

<script>
const API = "https://bharatcloud-api.sahilrana1940.workers.dev";
const EMAIL = localStorage.getItem("bharatcloud_email") || "admin@bharatcloud.com";

async function loadFiles() {
  try {
    const res = await fetch(`${API}/list?prefix=${EMAIL}/`);
    const files = await res.json();
    const div = document.getElementById("files");
    if (files.length === 0) {
      div.innerHTML = "No files yet";
    } else {
      div.innerHTML = files.map(f => {
        const shortName = f.name.split('/').pop();
        return `<div style="margin:5px">${shortName} - ${(f.size/1024).toFixed(1)} KB <a href="${API}/file/${f.name}" target="_blank">[Open]</a></div>`;
      }).join("");
    }
  } catch (e) {
    document.getElementById("files").innerText = "Error loading files";
  }
}

async function upload() {
  const input = document.getElementById("fileInput");
  if (!input.files[0]) return alert("Choose file");
  const file = input.files[0];
  const fd = new FormData();
  fd.append("file", file);
  fd.append("name", EMAIL + "/" + Date.now() + "-" + file.name);

  const btn = document.querySelector("button");
  btn.innerText = "Uploading...";
  await fetch(`${API}/upload`, { method: "POST", body: fd });
  btn.innerText = "Upload";
  alert("Uploaded ✅");
  loadFiles();
}

function logout() {
  localStorage.clear();
  location.reload();
}

loadFiles();
</script>
</body>
</html>
