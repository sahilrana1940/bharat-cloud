<!DOCTYPE html>
<html>
<head>
<link rel="manifest" href="/static/manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatCloud - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{height:100vh;display:flex;justify-content:center;align-items:center;background:#f5f5f7}
.card{width:360px;background:#fff;border-radius:20px;padding:30px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.1)}
input{width:100%;padding:14px;border:1px solid #eee;background:#f9f9f9;border-radius:12px;margin-bottom:12px;outline:none}
button{width:100%;padding:14px;background:#111;color:#fff;border-radius:30px;border:none;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h2>BharatCloud</h2>
<br>
<input type="text" placeholder="Username">
<input type="password" placeholder="Password">
<button>Login</button>
</div>
</body>
</html>
