<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BharatCloud</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#2563eb">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f5f7]">
<div class="flex h-screen">
<div class="w-64 bg-white p-6 hidden md:block border-r">
<h1 class="text-2xl font-bold">BharatCloud</h1>
<div class="mt-8 bg-black text-white p-3 rounded-xl">My Files</div>
</div>
<div class="flex-1 p-6">
<div class="flex justify-between">
<h2 class="text-2xl font-bold">My Files</h2>
<div class="flex gap-2">
<input type="file" id="fileInput" class="hidden">
<button onclick="document.getElementById('fileInput').click()" class="bg-black text-white p-3 rounded-xl">+ Upload</button>
</div>
</div>
<div id="filesList" class="mt-6">
<p class="text-gray-500">No files yet...</p>
</div>
</div>
</div>
</body>
</html>
