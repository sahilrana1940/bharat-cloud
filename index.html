<!DOCTYPE html>
<html>
<head>
<title>BharatCloud</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:sans-serif;max-width:600px;margin:40px auto;padding:20px}button{padding:8px 14px;cursor:pointer}#files div{border:1px solid #ddd;padding:8px;margin:6px 0;display:flex;justify-content:space-between}</style>
</head>
<body>
<h1>BharatCloud Dashboard ✅ Login Success!</h1>
<input type="file" id="fileInput"> <button onclick="uploadFile()">Upload</button>
<h2>My Files</h2>
<div id="files">Loading...</div>
<br><button onclick="logout()">Logout</button>
<script>
const API = "https://bharatcloud-api.sahilrana1940.workers.dev";
const EMAIL = localStorage.getItem("bharatcloud_email") || "admin@bharatcloud.com";
async function loadFiles(){
  try{
    const res = await fetch(`${API}/list?prefix=${EMAIL}/`);
    const json = await res.json();
    const files = json.files || [];
    const div = document.getElementById("files");
    if(files.length===0){ div.innerHTML="No files yet - Upload karo"; return; }
    div.innerHTML = files.map(f=>{
      const key=f.name; const name=key.split('/').pop();
      return `<div><span>${name}</span><span><a href="${API}/file/${encodeURIComponent(key)}" target="_blank">Open</a> <button onclick="deleteFile('${key}')">Del</button></span></div>`;
    }).join('');
  }catch(e){ document.getElementById("files").innerHTML="Error loading files"; }
}
async function uploadFile(){
  const inp=document.getElementById("fileInput"); if(!inp.files[0]) return alert("File choose karo");
  const fd=new FormData(); fd.append("file",inp.files[0]); fd.append("name",`${EMAIL}/${inp.files[0].name}`);
  await fetch(`${API}/upload`,{method:"POST",body:fd}); alert("Uploaded ✅"); loadFiles();
}
async function deleteFile(k){ await fetch(`${API}/delete/${encodeURIComponent(k)}`); loadFiles(); }
function logout(){ localStorage.clear(); location.reload(); }
loadFiles();
</script>
</body>
</html>
