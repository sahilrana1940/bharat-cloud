<!DOCTYPE html>
<html>
<head><title>BharatCloud</title></head>
<body>
<h2>BharatCloud Dashboard ✅ Login Success!</h2>
<input type="file" id="fileInput">
<button onclick="upload()">Upload</button>

<h2>My Files</h2>
<div id="files">Loading...</div>
<button onclick="logout()">Logout</button>

<script>
const API = "https://bharatcloud-api.sahilrana1940.workers.dev";

async function loadFiles() {
  try {
    const res = await fetch(`${API}/list`);
    const files = await res.json();
    const div = document.getElementById("files");
    if (files.length === 0) {
      div.innerHTML = "No files yet";
    } else {
      div.innerHTML = files.map(f => 
        `<div><a href="${API}/file/${f.name}" target="_blank">${f.name}</a> (${(f.size/1024).toFixed(1)} KB)</div>`
      ).join("");
    }
  } catch (e) {
    document.getElementById("files").innerText = "Error loading files";
  }
}

async function upload() {
  const input = document.getElementById("fileInput");
  if (!input.files[0]) return alert("Choose file");
  const fd = new FormData();
  fd.append("file", input.files[0]);
  fd.append("name", input.files[0].name);
  await fetch(`${API}/upload`, { method: "POST", body: fd });
  alert("Uploaded!");
  loadFiles();
}

function logout() { location.reload(); }

loadFiles();
</script>
</body>
</html>
